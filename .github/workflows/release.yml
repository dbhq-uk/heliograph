name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'tag to build (for a dry run, without publishing)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Cross-compile and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          check-latest: true

      - name: Tests must pass before anything is published
        # A release that was never tested is worse than no release: it carries
        # the authority of a version number.
        run: go test ./... -count=1

      - name: Build
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # CGO off, so the binary is static and runs on a machine with a
          # different libc than the one that built it. That is the whole
          # proposition: nothing to install.
          export CGO_ENABLED=0
          for target in \
            linux/amd64 linux/arm64 \
            darwin/amd64 darwin/arm64 \
            windows/amd64 windows/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            out="dist/heliograph-${os}-${arch}"
            [ "$os" = windows ] && out="${out}.exe"
            echo "building $out"
            GOOS="$os" GOARCH="$arch" go build \
              -trimpath \
              -ldflags "-s -w -X main.version=${TAG}" \
              -o "$out" ./cmd/heliograph
          done
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Bundle for MCP clients
        # One .mcpb per platform. The logic is in packaging/mcpb/build.sh so it
        # can be run and tested outside CI, and because it embeds a heredoc -
        # which, nested inside a YAML block scalar, takes the YAML indentation
        # with it and fails with a shell syntax error that says nothing about
        # bundles.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          packaging/mcpb/build.sh "${TAG#v}"
          cd dist && sha256sum *.mcpb >> SHA256SUMS && ls -la *.mcpb

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            dist/*

  npm:
    name: Publish the npm wrapper
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      # OIDC, not a token. npm trusted publishing mints a short-lived
      # credential scoped to this workflow, which cannot be extracted or
      # reused, so there is no long-lived NPM_TOKEN in this repository's
      # secrets to leak or to remember to rotate.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm 11.5.1 or newer. Node 24 ships one, but
      # pinning the CLI as well means a runner image change cannot silently
      # drop us back to token auth.
      - name: npm new enough for OIDC
        run: |
          npm install -g npm@latest
          npm --version

      - name: The package version must be the tag
        # The tag is the source of truth. packaging_test.go asserts these agree
        # at head; this asserts it again at the moment of publishing, because
        # the wrapper downloads a release named after its own version and a
        # mismatch here ships a package that 404s on install.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          want="${TAG#v}"
          got="$(node -p "require('./packaging/npm/package.json').version")"
          if [ "$want" != "$got" ]; then
            echo "::error::package.json is $got but the tag is $want. The published wrapper would download a release that does not exist."
            exit 1
          fi
          echo "version $got matches the tag"

      - name: Publish
        # No NODE_AUTH_TOKEN: the CLI detects the OIDC environment and uses it.
        # Provenance is attached by default under trusted publishing, so the
        # package carries a signed statement of which workflow built it.
        working-directory: packaging/npm
        run: npm publish --access public

      - name: It installs from the registry
        # Publishing is not the same as working. This installs the package the
        # way a user would, from the registry, and runs it - which exercises
        # the postinstall download and the checksum check against the release
        # the previous job just published.
        run: |
          set -euo pipefail
          cd "$(mktemp -d)"
          npm init -y >/dev/null
          ver="${GITHUB_REF_NAME#v}"

          # npm accepts a publish before the version is resolvable for install.
          # The first run of this step failed with ETARGET seconds after a
          # publish that had plainly succeeded, so it waits rather than calling
          # a propagation delay a failed release.
          #
          # It still fails in the end: a version that never becomes installable
          # is a broken release, and the difference between that and slow is
          # only how long you are willing to wait for it.
          for attempt in $(seq 1 20); do
            if npm install "@dbhq/heliograph@${ver}" 2>/dev/null; then
              echo "installed on attempt ${attempt}"
              break
            fi
            if [ "$attempt" = "20" ]; then
              echo "::error::@dbhq/heliograph@${ver} was published but is still not installable after 5 minutes"
              exit 1
            fi
            sleep 15
          done
          ./node_modules/.bin/heliograph version
          printf '{"jsonrpc":"2.0","id":1,"method":"tools/list"}\n' \
            | ./node_modules/.bin/heliograph mcp \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const t=JSON.parse(s).result.tools;if(t.length!==7){console.error('::error::got '+t.length+' tools, want 7');process.exit(1)}console.log('installed from npm and served '+t.length+' tools')})"

  image:
    name: Publish the container image
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # For the build provenance attestation, which is what lets somebody
      # verify this image came from this workflow and not from a laptop.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          # arm64 as well as amd64: an Apple laptop and a Graviton box are both
          # ordinary places to run this, and an amd64-only image emulates on
          # both, slowly and silently.
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/dbhq-uk/heliograph:${{ github.ref_name }}
            ghcr.io/dbhq-uk/heliograph:latest
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/dbhq-uk/heliograph
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: It answers introspection
        # The Dockerfile's header tells people to run this image. Publishing one
        # that starts and then does nothing useful would make that a lie in a
        # more expensive way than not publishing at all.
        run: |
          set -euo pipefail
          out="$(printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | docker run -i --rm "ghcr.io/dbhq-uk/heliograph:${GITHUB_REF_NAME}")"
          echo "$out"
          n="$(printf '%s' "$out" | grep -c '"name":"heliograph_' || true)"
          if [ "$n" -lt 1 ]; then
            echo "::error::the published image did not list its tools"
            exit 1
          fi
          echo "the published image serves its tools"
