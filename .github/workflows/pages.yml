name: pages

on:
  push:
    branches: [main]
    paths: ['site/**', 'internal/site/**', 'cmd/heliograph-site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and a newer one wins. A queue of doc builds racing
# each other publishes whichever finished last, which is not necessarily the
# latest.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The sitemap's lastmod is the last commit that touched each page.
          # A shallow clone would date every page today, so the build refuses
          # one; this is the remedy it names.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          check-latest: true

      - name: build
        run: go run ./cmd/heliograph-site

      - name: serve index.html at the root
        # The generator emits index.html, which Pages already serves at /. The
        # per-page URLs are /install rather than /install.html, so each page
        # also needs a directory form. Copied rather than redirected: a
        # redirect costs every agent an extra round trip on every read.
        run: |
          set -euo pipefail
          cd site/dist
          for f in *.html; do
            slug="${f%.html}"
            [ "$slug" = index ] && continue
            mkdir -p "$slug"
            cp "$f" "$slug/index.html"
            cp "$slug.md" "$slug/index.md" 2>/dev/null || true
          done
          # CNAME so the custom domain survives a deploy.
          echo "heliograph.dbhq.uk" > CNAME
          ls -la

      - name: redirect stub for the old /intercom URL
        # GitHub Pages does not read the generator's _redirects file (that is
        # a Cloudflare Pages mechanism), so the published /intercom link would
        # otherwise 404. Written here, after the build, rather than emitted by
        # the site generator, so it never has to carry a markdown mirror or
        # JSON-LD the way a real generated page must.
        run: |
          set -euo pipefail
          mkdir -p site/dist/intercom
          cat > site/dist/intercom/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <title>Moved to /flare</title>
          <link rel="canonical" href="/flare">
          <meta http-equiv="refresh" content="0; url=/flare">
          </head>
          <body>
          <p>This page moved. Continue to <a href="/flare">/flare</a>.</p>
          </body>
          </html>
          EOF

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist
      - id: deploy
        uses: actions/deploy-pages@v5
