name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go builds, vets and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          check-latest: true

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "::error::gofmt would change these files:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: unit tests
        run: go test ./... -count=1

      - name: only the dependencies that were argued for
        # This repository had none, and the check that enforced it did its job:
        # it forced the argument before the first one arrived.
        #
        # golang.org/x/crypto is here for ChaCha20-Poly1305, which is the one
        # primitive the seal construction needs that the standard library does
        # not have. Everything else - X25519, HKDF, Ed25519, SHA-256 - is
        # stdlib. The alternative was AES-GCM, and it was rejected because Go's
        # software AES is not constant time on a machine without AES-NI, which
        # a station may well be.
        #
        # x/sys is x/crypto's own dependency, for CPU feature detection.
        #
        # Adding to this list needs a sentence in the PR saying what the
        # standard library could not do.
        #
        # Checked against what is actually LINKED, not the module graph.
        # `go list -m all` includes modules nothing imports - x/net, x/text and
        # x/term arrive as x/crypto's declared requirements without a single
        # byte of them reaching the binary - so gating on that reports
        # dependencies the product does not have.
        #
        # `vendor/golang.org/x/...` is excluded because it is the standard
        # library's OWN vendored copy, which crypto/tls uses. It is stdlib
        # wearing a confusing path, not something this repository chose.
        run: |
          set -euo pipefail
          allowed="golang.org/x/crypto golang.org/x/sys"
          bad=0
          while read -r pkg; do
            root="$(echo "$pkg" | cut -d/ -f1-3)"
            case " $allowed " in
              *" $root "*) ;;
              *) echo "::error::undeclared dependency linked into the binary: $pkg"; bad=1 ;;
            esac
          done < <(go list -deps ./... | grep '\.' | grep -v '^github.com/dbhq-uk/heliograph' | grep -v '^crypto/internal/' | grep -v '^vendor/')
          [ "$bad" = "0" ] || exit 1
          echo "linked dependencies: $allowed"

  e2e:
    name: The CLI drives a real station
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          check-latest: true

      # The station lives in this repository since the merge, so there is no
      # second checkout and nothing for the test to skip - but the non-skip
      # assertion stays: a silently skipped end-to-end test is the same shape
      # of problem as a green suite that checked nothing.
      #
      # ONE PER TRANSPORT THAT HAS BOTH HALVES, because a round trip over one
      # says nothing about another. Each is two implementations of a layout on
      # opposite sides of a gap nobody can reach, and a disagreement between
      # them is two sides that each work perfectly and never meet. The relay's
      # is the one that has earned it most: four defects surfaced within an
      # hour of it first running, and none of them errored anywhere.
      - name: the CLI drives a stock station, and both bootstraps agree
        run: |
          out="$(go test ./cmd/heliograph/ -run 'TestCLIDrivesAStockStation|TestCLIDrivesAShareStation|TestCLIDrivesARelayStation|TestBootstrapMatchesTheShellScript' -v -count=1)"
          echo "$out"
          if echo "$out" | grep -q -- '--- SKIP'; then
            echo "::error::the end-to-end test skipped instead of running."
            exit 1
          fi
          for want in CLIDrivesAStockStation CLIDrivesAShareStation CLIDrivesARelayStation BootstrapMatchesTheShellScript; do
            echo "$out" | grep -q -- "--- PASS: Test$want" || {
              echo "::error::Test$want did not run. If it was renamed, rename it here too."
              exit 1
            }
          done

      # THE DEPLOYED RELAY, on main only.
      #
      # Everything above is measured against a local double, which proves the
      # two halves agree and says nothing about the thing actually running at
      # heliograph-relay.dbhq.uk - its TLS, its custom domain, its Durable
      # Object routing, or whether the token it was configured with is still
      # the token we hold. Those fail independently of this repository, and
      # silently: the first anybody would know is a station that cannot reach
      # its relay.
      #
      # NOT ON PULL REQUESTS, because a PR from a fork gets no secrets and the
      # step would report a false negative for every contributor. It SKIPS
      # rather than fails without them, so a repository with no relay
      # configured is not broken by this.
      #
      # It touches a routing key no station can be named, so it collects
      # nothing anybody is waiting for - a GET on that API deletes what it
      # returns.
      - name: the deployed relay still answers this credential
        if: github.event_name == 'push'
        env:
          HELIOGRAPH_RELAY_URL: ${{ secrets.HELIOGRAPH_RELAY_URL }}
          HELIOGRAPH_RELAY_ESTATE: ${{ secrets.HELIOGRAPH_RELAY_ESTATE }}
          HELIOGRAPH_RELAY_TOKEN: ${{ secrets.HELIOGRAPH_RELAY_TOKEN }}
        run: |
          if [ -z "${HELIOGRAPH_RELAY_TOKEN:-}" ]; then
            echo "no relay credential configured for this repository - skipping"
            exit 0
          fi
          go test ./cmd/heliograph -run TestRelayReachesTheDeployedRelay -v -count=1

      - name: the docs agree with the station
        # The end-to-end test proves the two halves INTEROPERATE. This proves
        # they DESCRIBE each other correctly, which is a different failure.
        #
        # The MCP tool descriptions tell a model that an action needs
        # CONFIRM=yes and --allow-actions. A model follows that literally. If
        # the station ever spelled a gate differently, every such request would
        # be refused, the model would read the refusal as a fault, and it would
        # retry forever against a machine nobody here can reach.
        run: |
          set -euo pipefail
          out="$(go test ./cmd/heliograph/ -v -count=1 \
                   -run 'GateSpellingsMatchTheStation|WirePathsMatchTheStation|StatusStatesAreAllKnownHere|TheIDIsTheTrigger')"
          echo "$out"
          if echo "$out" | grep -q -- '--- SKIP'; then
            echo "::error::a coherence check skipped instead of running."
            exit 1
          fi
          # Four checks, named individually rather than counted loosely: a
          # renamed test that stops matching the -run pattern would otherwise
          # pass this step by not existing.
          for want in GateSpellingsMatchTheStation WirePathsMatchTheStation \
                      StatusStatesAreAllKnownHere TheIDIsTheTrigger; do
            echo "$out" | grep -q -- "--- PASS: Test$want" || {
              echo "::error::Test$want did not run. If it was renamed, rename it here too."
              exit 1
            }
          done

  station-purity:
    name: No Go crosses the gap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Everything under station/ ships to the far side, where "plain bash,
      # you can read it before you run it" is the entire proposition. The one
      # exception is station/embed.go, which exists so the binary can carry
      # the payload and never ships anywhere.
      - name: the only Go under station/ is embed.go
        run: |
          bad="$(find station -name '*.go' ! -path 'station/embed.go')"
          if [ -n "$bad" ]; then
            echo "$bad"
            echo "::error::Go under station/ beyond embed.go. The far side never gets a binary dependency."
            exit 1
          fi
          echo "station/ is clean"

  site:
    name: The site builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The sitemap's lastmod is the last commit that touched each page.
          # A shallow clone would date every page today, so the build refuses
          # one; this is the remedy it names.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          check-latest: true
      - name: build
        run: go run ./cmd/heliograph-site
      - name: every page has all three renderings
        # HTML for people, .md for agents, and a line in llms.txt. A page
        # missing one of those is published to a reader who cannot see it.
        run: |
          set -euo pipefail
          for f in site/content/*.md; do
            slug="$(basename "$f" .md)"
            for want in "site/dist/$slug.html" "site/dist/$slug.md"; do
              [ -f "$want" ] || { echo "::error::missing $want"; exit 1; }
            done
            grep -q "/$slug.md" site/dist/llms.txt || {
              echo "::error::$slug is not in llms.txt"; exit 1; }
          done
          echo "every page has HTML, markdown and an llms.txt entry"
      - name: no code block leaked into a description
        # Summary once walked into a fence, and the result went into llms.txt -
        # the one place a wrong description is read by something that cannot
        # tell it is wrong.
        run: |
          if grep -qE '^\- \[.*\]\(.*\): (heliograph (init|send)|\$ )' site/dist/llms.txt; then
            echo "::error::a code block was rendered as a page description"
            exit 1
          fi
          echo "descriptions are prose"

  style:
    name: House style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # terraform is not on the runner by default, and the step that needs it
      # failed with "command not found" rather than anything about the config.
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: no em dashes
        run: |
          if grep -rn "$(printf '\xe2\x80\x94')" --include='*.md' --include='*.go' . ; then
            echo "::error::Em dash found. House style is a plain hyphen."
            exit 1
          fi
          echo "No em dashes."

      - name: nothing secret is in this public repository
        # The whole argument for committing account ids, zone ids and the
        # deployment itself rests on nothing secret being here. An argument
        # nobody checks is a hope, so it is checked.
        run: |
          set -uo pipefail
          bad=0
          # Credential shapes, by the prefixes vendors publish so that scanners
          # can spot them. Not a guarantee, a floor.
          # Matches outside the baseline. A baseline rather than a mute: these
          # fixtures exist to prove that redaction and the plant instructions
          # work, so they must stay readable, while anything NEW fails.
          hits="$(grep -rInE "(ghp_|github_pat_|glpat-|xox[abposr]-|AKIA[0-9A-Z]{16}|sk-[A-Za-z0-9]{20,})" \
                    --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist \
                    --exclude=.secret-scan-allow . || true)"
          unexpected=0
          while IFS= read -r hit; do
            [ -n "$hit" ] || continue
            file="${hit%%:*}"
            grep -q "^${file#./}:" .secret-scan-allow || { echo "UNEXPECTED: $hit"; unexpected=1; }
          done <<< "$hits"
          if [ "$unexpected" = "1" ]; then
            echo "::error::a credential shape appears in a file that is not in .secret-scan-allow"
            bad=1
          fi
          # Cloudflare API tokens are 40 characters of [A-Za-z0-9_-] with no
          # prefix, so they cannot be caught by shape. What CAN be caught is the
          # variable being assigned a long literal.
          #
          # The pattern deliberately does not try to match a quote character.
          # The first version did, and the nested escaping needed to put both
          # quote kinds inside a double-quoted YAML scalar produced a shell
          # SYNTAX error - which exits 2, fails the step, and says nothing about
          # secrets at all. A gate too clever to parse is a gate that is red for
          # the wrong reason.
          lit="$(grep -rInE "(CLOUDFLARE_API_TOKEN|TF_VAR_cloudflare_api_token)[[:space:]]*=[[:space:]]*.?[A-Za-z0-9_-]{25,}" \
                   --exclude-dir=.git --exclude-dir=node_modules . || true)"
          if [ -n "$lit" ]; then
            echo "$lit"
            echo "::error::an API token appears to be assigned a literal value"
            bad=1
          fi
          # State, which is the real risk and the one people forget.
          #
          # `|| true` on every grep, because the step runs under `bash -e` and a
          # grep that matches NOTHING exits 1. Without it this gate failed
          # precisely when the repository was clean, which is the worst
          # direction for a check to fail in: it trains people to ignore it.
          state="$(git ls-files | grep -E "\.tfstate|\.tfvars$|\.terraform/" || true)"
          if [ -n "$state" ]; then
            echo "$state"
            echo "::error::terraform state or variables are tracked. State holds secret values verbatim."
            bad=1
          fi
          keys="$(grep -rIn "BEGIN [A-Z ]*PRIVATE KEY" --exclude-dir=.git . || true)"
          if [ -n "$keys" ]; then
            echo "$keys"
            echo "::error::a private key is present"
            bad=1
          fi
          [ "$bad" = "0" ] || exit 1
          echo "no credential shapes, no state, no private keys"

      - name: terraform is valid and formatted
        run: |
          terraform -chdir=infra fmt -check -diff
          terraform -chdir=infra init -backend=false >/dev/null
          terraform -chdir=infra validate

      - name: the specs are still there
        # They are the only thing in this repository that is finished, and a
        # PR that removes one should have to say so out loud.
        run: |
          for f in docs/specs/2026-09-06-heliograph-next-design.md \
                   docs/specs/2026-09-06-relay-encryption-design.md; do
            [ -f "$f" ] || { echo "::error::missing $f"; exit 1; }
          done
