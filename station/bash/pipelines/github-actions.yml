# =============================================================================
#  heliograph on a GitHub Actions self-hosted runner
# =============================================================================
#  Copy this to .github/workflows/heliograph.yml IN THE TRANSPORT REPO.
#
#  No infrastructure. The runner is already inside the estate's network with
#  git credentials, because that is what a build agent is for. "Add a workflow"
#  is a normal, already-approved activity; "deploy a container into production"
#  is a change board conversation. For a change-controlled estate that is the
#  difference between next week and next quarter.
#
#  IT TRIGGERS ON THE REQUEST, NOT ON A SCHEDULE. A cron would mean waiting for
#  the next tick for every step, and a hundred steps would mean a hundred waits.
#  Pushing a request IS the trigger, so the latency is however long a runner
#  takes to start.
#
#  THE PATH FILTER IS LOAD-BEARING, NOT TIDINESS. This job pushes a log back,
#  and that push is a commit. Without the filter it would trigger itself, then
#  do it again, until somebody noticed the bill. Logs land in ops-logs/ and the
#  agent writes station/status, so filtering to station/request alone means neither
#  can re-fire it. This is the same distinction station.sh already makes: docs and
#  step edits land on a task branch constantly and must not start a run.
#
#  GitHub gives a second guard for free: a push made with the built-in
#  GITHUB_TOKEN does not trigger another workflow run. Two guards, because a
#  runaway loop is expensive and embarrassing.
#
#  THIS ONE IS GIT-ONLY, AND THAT IS THE DESIGN RATHER THAN A GAP.
#
#  Every other host takes TRANSPORT and runs whatever channel it names. Here the
#  git push IS the trigger: `on: push: paths: station/request` is what makes the
#  latency "however long a runner takes to start" instead of "however long until
#  the next cron tick". A relay or a share has no push to fire on.
#
#  SO A NON-GIT STATION IN A PIPELINE IS NOT SHIPPED, and that is a statement
#  rather than an omission. It would be a scheduled job costing a wait per step,
#  every step - the exact trade the header above rejects - and it needs four
#  things this file cannot supply for you:
#
#    1. `on: schedule:` INSTEAD of the push trigger, and `workflow_dispatch` so
#       somebody can serve a request now rather than at the next tick.
#    2. TRANSPORT and the transport's variables, from repository secrets.
#    3. FOR THE RELAY: the two key files written to disk from secrets before the
#       run, with RELAY_IDENTITY and RELAY_PEER pointing at them - the transport
#       reads paths, not values - and `heliograph-seal` on the runner. The
#       container image carries that binary; a bare runner does not, so it has
#       to be downloaded from the release and checksum-verified.
#    4. A concurrency group, as below, because a schedule can overlap itself.
#
#  None of that is exercised by any test here, so it is described rather than
#  pasted: a recipe nobody has run is a recipe that does not work.
# =============================================================================
name: heliograph

on:
  push:
    paths:
      - 'station/request'
  workflow_dispatch:

# One run at a time. Two requests pushed close together would otherwise race on
# the same checkout. cancel-in-progress is FALSE on purpose: a step that is
# halfway through changing something must not be killed to make room for a
# queued request, which is the same reason station.sh refuses to cancel on a new
# id and queues instead.
concurrency:
  group: heliograph
  cancel-in-progress: false

jobs:
  run-request:
    # Change this to the label of a runner inside the estate. `ubuntu-latest`
    # is GitHub-hosted and can reach nothing on your network, so it is only
    # useful for proving the wiring.
    runs-on: ubuntu-latest

    permissions:
      contents: write        # the log has to be committed and pushed back

    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, because cap_push commits onto this branch and a
          # shallow clone cannot push cleanly.
          fetch-depth: 0

      - name: Run the requested step
        run: |
          git config user.name  "heliograph agent"
          git config user.email "heliograph@users.noreply.github.com"
          # --once, not the polling loop. A workflow run holds a runner for its
          # whole duration, and polling git every five seconds for an hour
          # would block everyone else's builds. The push already told us there
          # is exactly one request to serve.
          ./start.sh -- --once
